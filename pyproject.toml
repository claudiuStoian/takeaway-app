[project]
name = "takeaway-app"
version = "0.1.0"
description = "Backend for a small takeaway platform"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
